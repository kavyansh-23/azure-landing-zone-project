apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-one
  labels:
    app: ms-one
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-one
  template:
    metadata:
      labels:
        app: ms-one
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ms-one-svc
spec:
  selector:
    app: ms-one
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP